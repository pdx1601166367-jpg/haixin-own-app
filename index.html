<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作生活专属 App</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/ui-refresh.css">
  <link rel="stylesheet" href="css/appearance.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10.5 9-7.5 9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg>
        </span>
        <div class="brand-copy"><strong>海星的工作生活</strong><span>本地个人空间</span></div>
      </div>
      <button type="button" id="sidebar-quick-create" class="btn btn-primary quick-create">+ 快速新增</button>
      <nav id="nav" class="nav" aria-label="模块导航"></nav>
      <div class="sidebar-foot">
        <span class="status-dot" aria-hidden="true"></span>
        <div><strong>仅保存在这台电脑</strong><small id="sidebar-storage-note">本地数据，无需联网</small></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <span class="toolbar-module-icon" id="module-icon" aria-hidden="true"></span>
          <div class="toolbar-context"><strong id="module-title">首页总览</strong><span id="topbar-date"></span></div>
        </div>
        <div class="topbar-right">
          <div class="global-search">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <input type="search" id="top-search-input" placeholder="搜索所有内容" aria-label="搜索所有内容">
            <button type="button" id="global-search-btn" class="icon-btn" aria-label="打开搜索" title="搜索 (Ctrl+K)"></button>
          </div>
          <button type="button" id="quick-create-btn" class="btn btn-primary btn-sm">+ 快速新建</button>
          <button type="button" id="manual-save-btn" class="btn btn-sm">手动保存</button>
          <button type="button" id="save-exit-btn" class="btn btn-sm">保存并退出</button>
          <span id="save-indicator" class="save-indicator">自动保存</span>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/plan.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/media.js"></script>
  <script src="js/views/campus.js"></script>
  <script src="js/views/product.js"></script>
  <script src="js/views/fitness.js"></script>
  <script src="js/views/diet.js"></script>
  <script src="js/views/game.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
